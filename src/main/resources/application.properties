spring.application.name=playpulse
spring.datasource.url=jdbc:postgresql://localhost:5433/playpulse?reWriteBatchedInserts=true
spring.datasource.username=playpulse
spring.datasource.password=playpulse

spring.jpa.hibernate.ddl-auto=validate

# Send many INSERTs to Postgres in one round trip (used when a match event creates ~1,500 jobs at once).
spring.jpa.properties.hibernate.jdbc.batch_size=200

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Load-tested on 8 cores / Docker Postgres: 16 workers beat 8 (+26%) and 32 (contention made it slower).
playpulse.worker.count=16
spring.datasource.hikari.maximum-pool-size=24

# Retry: attempts include the first try. Delay = base * 2^(attempt-1), capped, with jitter.
playpulse.retry.max-attempts=3
playpulse.retry.base-delay-ms=1000
playpulse.retry.max-delay-ms=60000

# Recovery sweep: how often to run, how long a PENDING/FAILED job may be missing from Redis,
# and how long a job may sit RUNNING before it is presumed dead (must exceed the slowest handler).
playpulse.recovery.interval-ms=15000
playpulse.recovery.stale-after-ms=30000
playpulse.recovery.running-timeout-ms=60000

# Dev-only helpers such as POST /api/dev/seed. Set to false anywhere real data lives.
playpulse.dev-endpoints.enabled=true
