services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: playpulse
      POSTGRES_USER: playpulse
      POSTGRES_PASSWORD: playpulse
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
